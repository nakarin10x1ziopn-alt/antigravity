<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏓 Pong — AI Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07071a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 10px;
      margin-bottom: 6px;
      color: #00ffff;
      text-shadow: 0 0 24px #00ffff99;
    }

    /* ---- Scoreboard ---- */
    .scoreboard {
      display: flex;
      align-items: center;
      gap: 60px;
      margin-bottom: 10px;
    }
    .score-block { text-align: center; }
    .player-label {
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: #555;
      margin-bottom: 2px;
    }
    .score-num {
      font-size: 3rem;
      font-weight: bold;
      line-height: 1;
    }
    #p1score { color: #ff6ec7; text-shadow: 0 0 14px #ff6ec799; }
    #p2score { color: #6ef0ff; text-shadow: 0 0 14px #6ef0ff99; }

    /* Difficulty badge */
    .diff-badge {
      font-size: 0.65rem;
      letter-spacing: 2px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #333;
      color: #888;
    }

    canvas {
      border: 2px solid #1a1a3a;
      border-radius: 4px;
      box-shadow: 0 0 50px #00ffff18, 0 0 100px #00ffff0a;
    }

    /* ---- AI Status Bar ---- */
    .ai-bar {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.65rem;
      color: #444;
      letter-spacing: 1px;
    }
    .ai-bar .ai-label { color: #6ef0ff88; }
    .ai-state {
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid #333;
      font-size: 0.6rem;
      letter-spacing: 1px;
      transition: color 0.3s, border-color 0.3s;
    }
    .ai-state.tracking  { color: #6ef0ff; border-color: #6ef0ff44; }
    .ai-state.predicting{ color: #ffe06e; border-color: #ffe06e44; }
    .ai-state.idle      { color: #444;    border-color: #333; }

    .controls {
      margin-top: 8px;
      font-size: 0.65rem;
      color: #333;
      letter-spacing: 1px;
    }
    .controls span { color: #ff6ec799; }

    /* ---- Overlays ---- */
    .overlay {
      position: fixed; inset: 0;
      background: #07071aee;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; gap: 0;
    }
    .overlay h2 {
      font-size: 2rem; letter-spacing: 6px;
      margin-bottom: 6px;
    }
    .overlay p { color: #555; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 20px; }

    /* Difficulty selector */
    .diff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .diff-btn {
      padding: 14px 24px;
      background: transparent;
      border: 2px solid #333;
      color: #888;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .diff-btn .diff-icon { font-size: 1.5rem; }
    .diff-btn .diff-sub  { font-size: 0.6rem; color: #555; letter-spacing: 1px; }
    .diff-btn:hover, .diff-btn.selected {
      border-color: var(--c);
      color: var(--c);
      box-shadow: 0 0 16px var(--c-glow);
    }
    .diff-btn[data-d="easy"]       { --c:#4eff91; --c-glow:#4eff9144; }
    .diff-btn[data-d="medium"]     { --c:#ffe06e; --c-glow:#ffe06e44; }
    .diff-btn[data-d="hard"]       { --c:#ff7b4e; --c-glow:#ff7b4e44; }
    .diff-btn[data-d="impossible"] { --c:#ff4e4e; --c-glow:#ff4e4e44; }

    .btn {
      padding: 11px 36px;
      border: 2px solid #00ffff;
      background: transparent;
      color: #00ffff;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem; letter-spacing: 3px;
      cursor: pointer; text-transform: uppercase; transition: all 0.2s;
    }
    .btn:hover {
      background: #00ffff;
      color: #07071a;
      box-shadow: 0 0 20px #00ffff88;
    }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .hidden { display: none !important; }

    #countdown {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 8rem; font-weight: bold;
      color: #00ffff; text-shadow: 0 0 40px #00ffff;
      pointer-events: none; z-index: 9;
      opacity: 0; transition: opacity 0.3s;
    }

    /* Win overlay extras */
    .win-scores {
      font-size: 1.8rem;
      letter-spacing: 6px;
      margin-bottom: 10px;
    }
    .win-diff { font-size: 0.65rem; letter-spacing: 2px; color: #555; margin-bottom: 24px; }
  </style>
</head>
<body>

<h1>PONG</h1>

<div class="scoreboard">
  <div class="score-block">
    <div class="player-label">YOU</div>
    <div class="score-num" id="p1score">0</div>
  </div>
  <div class="diff-badge" id="diffBadge">—</div>
  <div class="score-block">
    <div class="player-label">AI</div>
    <div class="score-num" id="p2score">0</div>
  </div>
</div>

<canvas id="canvas" width="800" height="500"></canvas>

<div class="ai-bar">
  <span class="ai-label">🤖 AI STATUS</span>
  <span class="ai-state idle" id="aiState">IDLE</span>
  <span id="aiDiffLabel" style="color:#555">—</span>
</div>

<div class="controls">
  🎮 Player: <span>W</span> ขึ้น &nbsp;|&nbsp; <span>S</span> ลง &nbsp;&nbsp;&nbsp; หรือ เมาส์/ทัช
</div>

<!-- ===== Start Overlay ===== -->
<div class="overlay" id="startOverlay">
  <h2 style="color:#00ffff;text-shadow:0 0 20px #00ffff88">🏓 PONG AI</h2>
  <p>CHOOSE DIFFICULTY</p>

  <div class="diff-grid">
    <button class="diff-btn" data-d="easy" onclick="selectDiff(this)">
      <span class="diff-icon">🟢</span>
      EASY
      <span class="diff-sub">AI ช้า — เหมาะสำหรับมือใหม่</span>
    </button>
    <button class="diff-btn" data-d="medium" onclick="selectDiff(this)">
      <span class="diff-icon">🟡</span>
      MEDIUM
      <span class="diff-sub">AI พอสู้ได้ — มีผิดพลาดบ้าง</span>
    </button>
    <button class="diff-btn" data-d="hard" onclick="selectDiff(this)">
      <span class="diff-icon">🔴</span>
      HARD
      <span class="diff-sub">AI รวดเร็ว — ต้องใช้ทักษะ</span>
    </button>
    <button class="diff-btn" data-d="impossible" onclick="selectDiff(this)">
      <span class="diff-icon">💀</span>
      IMPOSSIBLE
      <span class="diff-sub">AI คาดการณ์ล่วงหน้า — แทบชนะไม่ได้</span>
    </button>
  </div>

  <button class="btn" id="startBtn" onclick="startGame()" disabled>SELECT DIFFICULTY</button>
</div>

<!-- ===== Win Overlay ===== -->
<div class="overlay hidden" id="winOverlay">
  <h2 id="winTitle">YOU WIN!</h2>
  <div class="win-scores" id="winScores"></div>
  <div class="win-diff" id="winDiff"></div>
  <div style="display:flex;gap:14px;">
    <button class="btn" onclick="rematch()">REMATCH</button>
    <button class="btn" style="border-color:#555;color:#555;" onclick="backToMenu()">MENU</button>
  </div>
</div>

<div id="countdown"></div>

<!-- ===== SCRIPT ===== -->
<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

const W = canvas.width, H = canvas.height;
const WIN_SCORE  = 7;
const PADDLE_W   = 12;
const PADDLE_H   = 90;
const BALL_R     = 7;
const BASE_SPEED = 5.5;

// ---- Audio ----
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  return audioCtx;
}
function playBeep(freq=440, dur=0.07, type='square', vol=0.15) {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.start(); osc.stop(ac.currentTime + dur);
  } catch(e){}
}

// ---- Difficulty configs ----
const DIFFS = {
  easy: {
    label: 'EASY', color: '#4eff91',
    reactionDelay: 20,   // frames before AI reacts
    speed: 3.5,          // max paddle speed
    errorMargin: 60,     // px random offset from perfect position
    predictionDepth: 0,  // no look-ahead
    missChance: 0.25,    // random miss chance
  },
  medium: {
    label: 'MEDIUM', color: '#ffe06e',
    reactionDelay: 10,
    speed: 5.0,
    errorMargin: 30,
    predictionDepth: 1,
    missChance: 0.10,
  },
  hard: {
    label: 'HARD', color: '#ff7b4e',
    reactionDelay: 4,
    speed: 7.5,
    errorMargin: 10,
    predictionDepth: 3,
    missChance: 0.03,
  },
  impossible: {
    label: 'IMPOSSIBLE', color: '#ff4e4e',
    reactionDelay: 1,
    speed: 12,
    errorMargin: 0,
    predictionDepth: 10,
    missChance: 0,
  },
};

// ---- State ----
let selectedDiff = null;
let diffCfg = null;
let gameRunning = false;
let animId = null;
let p1, aiPaddle, ball, particles;
let aiTarget = H/2, aiReactTimer = 0, aiError = 0, aiMissing = false;
let aiStatusText = 'IDLE';

// ---- Input (keyboard + mouse) ----
const keys = {};
let mouseY = H/2;
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup',  e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseY = (e.clientY - rect.top) * (H / rect.height);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseY = (e.touches[0].clientY - rect.top) * (H / rect.height);
}, { passive: false });

// ---- Difficulty selection ----
function selectDiff(btn) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDiff = btn.dataset.d;
  diffCfg = DIFFS[selectedDiff];
  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = `START — ${diffCfg.label}`;
  startBtn.disabled = false;
}

// ---- Init ----
function initState() {
  p1 = { x: 20, y: H/2 - PADDLE_H/2 };
  aiPaddle = { x: W - 20 - PADDLE_W, y: H/2 - PADDLE_H/2 };
  ball = newBall(1);
  particles = [];
  aiTarget = H/2;
  aiReactTimer = 0;
  aiError = randError();
  aiMissing = false;
  aiStatusText = 'IDLE';
  updateAIStatus();
}

function newBall(dir=1) {
  const angle = (Math.random()*60 - 30) * Math.PI/180;
  const spd = BASE_SPEED;
  return {
    x: W/2, y: H/2,
    vx: Math.cos(angle)*spd*dir,
    vy: Math.sin(angle)*spd,
    trail: [],
  };
}

function randError() {
  if (!diffCfg) return 0;
  const m = diffCfg.errorMargin;
  return (Math.random()*2 - 1) * m;
}

// ---- AI: predict where ball will land on AI's x ----
function predictBallY(depth) {
  let bx = ball.x, by = ball.y, vx = ball.vx, vy = ball.vy;
  const targetX = aiPaddle.x;
  let bounces = 0;
  while (bx < targetX && bounces < depth + 20) {
    bx += vx; by += vy;
    if (by - BALL_R <= 0)   { by = BALL_R;   vy = Math.abs(vy); bounces++; }
    if (by + BALL_R >= H)   { by = H - BALL_R; vy = -Math.abs(vy); bounces++; }
  }
  return by;
}

function updateAIStatus() {
  const el = document.getElementById('aiState');
  el.className = 'ai-state';
  if (aiStatusText === 'TRACKING') {
    el.classList.add('tracking');
    el.textContent = '📡 TRACKING';
  } else if (aiStatusText === 'PREDICTING') {
    el.classList.add('predicting');
    el.textContent = '🔮 PREDICTING';
  } else {
    el.classList.add('idle');
    el.textContent = '💤 IDLE';
  }
}

// ---- Particles ----
function spawnParticles(x, y, color, count=14) {
  for (let i=0; i<count; i++) {
    const a = Math.random()*Math.PI*2, s = Math.random()*4+1;
    particles.push({ x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, color,
      size: Math.random()*4+2,
    });
  }
}

// ---- Draw ----
function drawBg() {
  ctx.fillStyle = '#07071a';
  ctx.fillRect(0, 0, W, H);
  ctx.setLineDash([10,16]);
  ctx.strokeStyle = '#151530';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPaddle(x, y, color, glow) {
  ctx.shadowBlur = 18; ctx.shadowColor = glow;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(x, y, PADDLE_W, PADDLE_H, 4); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBall() {
  for (let i=0; i<ball.trail.length; i++) {
    const t = ball.trail[i];
    const alpha = (i/ball.trail.length)*0.35;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    const r = BALL_R * (i/ball.trail.length) * 0.9;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 20; ctx.shadowColor = '#fff9';
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2); ctx.fill();
    p.x += p.vx; p.y += p.vy;
    p.life -= 0.028;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

// AI prediction line (Hard+)
function drawAIDebug() {
  if (!diffCfg || diffCfg.predictionDepth < 3) return;
  if (ball.vx <= 0) return; // only when ball heading toward AI
  const predictedY = predictBallY(diffCfg.predictionDepth);
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = '#6ef0ff';
  ctx.setLineDash([4, 8]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  ctx.lineTo(aiPaddle.x + PADDLE_W/2, predictedY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

// ---- Update ----
function update() {
  // Player movement
  const P_SPEED = 7;
  if (keys['w'] || keys['W']) p1.y -= P_SPEED;
  if (keys['s'] || keys['S']) p1.y += P_SPEED;

  // Mouse follow (smooth)
  const targetByMouse = mouseY - PADDLE_H/2;
  const diff = targetByMouse - p1.y;
  if (Math.abs(diff) > 2) p1.y += diff * 0.18;

  p1.y = Math.max(0, Math.min(H - PADDLE_H, p1.y));

  // ---- AI Brain ----
  aiReactTimer++;
  if (aiReactTimer >= diffCfg.reactionDelay) {
    aiReactTimer = 0;

    if (ball.vx > 0) {
      // Ball coming toward AI
      if (Math.random() < diffCfg.missChance) {
        // Intentional miss — go to wrong side
        aiMissing = true;
        aiTarget = ball.y > H/2 ? PADDLE_H/2 : H - PADDLE_H/2;
        aiStatusText = 'IDLE';
      } else {
        aiMissing = false;
        if (diffCfg.predictionDepth > 0) {
          aiTarget = predictBallY(diffCfg.predictionDepth) + aiError;
          aiStatusText = 'PREDICTING';
        } else {
          aiTarget = ball.y + aiError;
          aiStatusText = 'TRACKING';
        }
      }
    } else {
      // Ball going away — drift to center
      aiTarget = H/2;
      aiStatusText = 'IDLE';
    }

    // Recalculate random error each reaction tick
    if (!aiMissing) aiError = randError();
    updateAIStatus();
  }

  // Move AI paddle toward target
  const aiCenter = aiPaddle.y + PADDLE_H/2;
  const aiDiff = aiTarget - aiCenter;
  const aiMove = Math.min(Math.abs(aiDiff), diffCfg.speed) * Math.sign(aiDiff);
  aiPaddle.y += aiMove;
  aiPaddle.y = Math.max(0, Math.min(H - PADDLE_H, aiPaddle.y));

  // Ball trail
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 10) ball.trail.shift();

  // Ball move
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Top/bottom walls
  if (ball.y - BALL_R <= 0) { ball.y = BALL_R; ball.vy *= -1; playBeep(300, 0.05); }
  if (ball.y + BALL_R >= H) { ball.y = H - BALL_R; ball.vy *= -1; playBeep(300, 0.05); }

  // Player paddle hit
  if (
    ball.vx < 0 &&
    ball.x - BALL_R <= p1.x + PADDLE_W &&
    ball.x + BALL_R >= p1.x &&
    ball.y >= p1.y && ball.y <= p1.y + PADDLE_H
  ) {
    ball.x = p1.x + PADDLE_W + BALL_R;
    const hit   = (ball.y - (p1.y + PADDLE_H/2)) / (PADDLE_H/2);
    const angle = hit * 60 * Math.PI/180;
    const spd   = Math.min(Math.hypot(ball.vx, ball.vy) + 0.25, 15);
    ball.vx = Math.cos(angle) * spd;
    ball.vy = Math.sin(angle) * spd;
    spawnParticles(ball.x, ball.y, '#ff6ec7');
    playBeep(520, 0.08);
    // Reset AI error on player hit
    aiError = randError();
  }

  // AI paddle hit
  if (
    ball.vx > 0 &&
    ball.x + BALL_R >= aiPaddle.x &&
    ball.x - BALL_R <= aiPaddle.x + PADDLE_W &&
    ball.y >= aiPaddle.y && ball.y <= aiPaddle.y + PADDLE_H
  ) {
    ball.x = aiPaddle.x - BALL_R;
    const hit   = (ball.y - (aiPaddle.y + PADDLE_H/2)) / (PADDLE_H/2);
    const angle = hit * 60 * Math.PI/180;
    const spd   = Math.min(Math.hypot(ball.vx, ball.vy) + 0.25, 15);
    ball.vx = -Math.cos(angle) * spd;
    ball.vy = Math.sin(angle) * spd;
    spawnParticles(ball.x, ball.y, '#6ef0ff');
    playBeep(620, 0.08);
  }

  // Scoring
  if (ball.x < 0) {
    // AI scores
    updateScore('ai');
  }
  if (ball.x > W) {
    // Player scores
    updateScore('p1');
  }
}

function updateScore(who) {
  const p1s = parseInt(document.getElementById('p1score').textContent);
  const p2s = parseInt(document.getElementById('p2score').textContent);
  if (who === 'p1') {
    spawnParticles(W, ball.y, '#ff6ec7', 24);
    playBeep(150, 0.3, 'sawtooth');
    const ns = p1s + 1;
    document.getElementById('p1score').textContent = ns;
    if (ns >= WIN_SCORE) { endGame('player'); return; }
    ball = newBall(-1);
    aiError = randError();
  } else {
    spawnParticles(0, ball.y, '#6ef0ff', 24);
    playBeep(150, 0.3, 'sawtooth');
    const ns = p2s + 1;
    document.getElementById('p2score').textContent = ns;
    if (ns >= WIN_SCORE) { endGame('ai'); return; }
    ball = newBall(1);
    aiError = randError();
  }
}

// ---- Game Loop ----
function loop() {
  if (!gameRunning) return;
  update();
  drawBg();
  drawAIDebug();
  drawPaddle(p1.x, p1.y, '#ff6ec7', '#ff6ec788');
  drawPaddle(aiPaddle.x, aiPaddle.y, '#6ef0ff', '#6ef0ff88');
  drawBall();
  drawParticles();
  animId = requestAnimationFrame(loop);
}

// ---- Overlay controls ----
function startGame() {
  document.getElementById('startOverlay').classList.add('hidden');
  getAudio();
  initState();
  document.getElementById('p1score').textContent = 0;
  document.getElementById('p2score').textContent = 0;
  document.getElementById('diffBadge').textContent   = diffCfg.label;
  document.getElementById('diffBadge').style.color   = diffCfg.color;
  document.getElementById('diffBadge').style.borderColor = diffCfg.color + '55';
  document.getElementById('aiDiffLabel').textContent = diffCfg.label;
  document.getElementById('aiDiffLabel').style.color = diffCfg.color + '99';
  countdown(() => { gameRunning = true; loop(); });
}

function endGame(winner) {
  gameRunning = false;
  cancelAnimationFrame(animId);

  const p1s = document.getElementById('p1score').textContent;
  const p2s = document.getElementById('p2score').textContent;

  const overlay  = document.getElementById('winOverlay');
  const title    = document.getElementById('winTitle');
  const scores   = document.getElementById('winScores');
  const diffInfo = document.getElementById('winDiff');

  if (winner === 'player') {
    title.style.color = '#ff6ec7';
    title.style.textShadow = '0 0 20px #ff6ec788';
    title.textContent = '🏆 YOU WIN!';
    scores.innerHTML = `<span style="color:#ff6ec7">${p1s}</span> <span style="color:#333">—</span> <span style="color:#6ef0ff">${p2s}</span>`;
    playBeep(880, 0.4, 'sine');
    setTimeout(() => playBeep(1100, 0.4, 'sine'), 250);
    setTimeout(() => playBeep(1320, 0.5, 'sine'), 500);
  } else {
    title.style.color = '#6ef0ff';
    title.style.textShadow = '0 0 20px #6ef0ff88';
    title.textContent = '🤖 AI WINS!';
    scores.innerHTML = `<span style="color:#ff6ec7">${p1s}</span> <span style="color:#333">—</span> <span style="color:#6ef0ff">${p2s}</span>`;
    playBeep(200, 0.5, 'sawtooth');
    setTimeout(() => playBeep(150, 0.5, 'sawtooth'), 300);
  }

  diffInfo.textContent = `DIFFICULTY: ${diffCfg.label}`;
  diffInfo.style.color = diffCfg.color + '88';
  overlay.classList.remove('hidden');
}

function rematch() {
  document.getElementById('winOverlay').classList.add('hidden');
  initState();
  document.getElementById('p1score').textContent = 0;
  document.getElementById('p2score').textContent = 0;
  countdown(() => { gameRunning = true; loop(); });
}

function backToMenu() {
  document.getElementById('winOverlay').classList.add('hidden');
  document.getElementById('startOverlay').classList.remove('hidden');
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
  selectedDiff = null; diffCfg = null;
  const sb = document.getElementById('startBtn');
  sb.textContent = 'SELECT DIFFICULTY'; sb.disabled = true;
}

function countdown(cb) {
  const el = document.getElementById('countdown');
  let n = 3;
  el.style.opacity = '1';
  const tick = () => {
    if (n > 0) {
      el.textContent = n;
      playBeep(400 + n*80, 0.15, 'sine');
      n--;
      setTimeout(tick, 800);
    } else {
      el.textContent = 'GO!';
      playBeep(880, 0.2, 'sine');
      setTimeout(() => { el.style.opacity = '0'; cb(); }, 600);
    }
  };
  tick();
}

// Draw initial frame
(function() {
  ctx.fillStyle = '#07071a';
  ctx.fillRect(0, 0, W, H);
})();
</script>
</body>
</html>
